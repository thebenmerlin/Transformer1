name: GenAI Practical 3 - Prompt Programming and DSPy

on:
  workflow_dispatch:

jobs:
  practical3:
    name: Qwen3 Ollama prompt-programming experiment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print runner environment information
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Environment ==="
          uname -a
          echo "Architecture: $(uname -m)"
          python3 --version
          echo "=== RAM ==="
          free -h
          echo "=== Disk space ==="
          df -h

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait for its local API
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > ollama-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/version; then
              echo
              echo "Ollama API is responding."
              exit 0
            fi
            echo "Waiting for Ollama API (attempt $attempt/30)..."
            sleep 2
          done
          echo "Ollama failed to start:" >&2
          cat ollama-server.log >&2 || true
          exit 1

      - name: Pull and verify Qwen3 4B on this ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Capacity before pull ==="
          free -h
          df -h
          ollama pull qwen3:4b
          ollama --version
          ollama list
          echo "=== Capacity after pull ==="
          free -h
          df -h

      - name: Warm up Qwen3 4B and show loaded backend
        shell: bash
        run: |
          set -euo pipefail
          ollama run qwen3:4b "Reply only with: warm up complete." --keepalive 20m --think=false
          ollama ps

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Inspect current DSPy interface before experiment
        shell: bash
        run: |
          python3 - <<'PY'
          import inspect
          import dspy
          print(f"DSPy version: {dspy.__version__}")
          print(f"dspy.LM signature: {inspect.signature(dspy.LM)}")
          PY

      - name: Execute Practical 3 and save complete output
        shell: bash
        run: |
          set -o pipefail
          python3 -u practical3_prompt_programming.py 2>&1 | tee practical3_output.txt

      - name: Validate generated report source for local PDF build
        shell: bash
        run: |
          set -euo pipefail
          test -s practical3.tex
          echo "practical3.tex generated from actual experiment output."

      - name: Final diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Final Ollama status ==="
          ollama ps || true
          echo "=== Final capacity ==="
          free -h || true
          df -h || true
          echo "=== Ollama server log ==="
          tail -n 80 ollama-server.log || true

      - name: Upload Practical 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenAI-Practical-3-RBT23AR001
          path: |
            practical3_output.txt
            practical3_results.csv
            practical3.tex
            ollama-server.log
          if-no-files-found: warn
